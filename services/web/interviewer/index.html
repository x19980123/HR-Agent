<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>面试题单 · HR Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #12231f; --muted: #5a6f68; --line: rgba(18,35,31,.12);
      --accent: #0f766e; --accent-deep: #0b5c56;
      --font: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: var(--font); color: var(--ink);
      background: radial-gradient(800px 360px at 0% -10%, #c8ebe4 0%, transparent 55%), #f3f6f5;
    }
    main { max-width: 720px; margin: 0 auto; padding: 2rem 1.2rem 3rem; }
    .brand { font-weight: 700; color: var(--accent-deep); font-size: .85rem; margin-bottom: .6rem; }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.6rem, 4vw, 2rem); }
    .sub { color: var(--muted); margin: 0 0 1.2rem; line-height: 1.5; }
    .panel {
      background: rgba(255,255,255,.88); border-radius: 20px; padding: 1.25rem 1.3rem;
      box-shadow: 0 16px 36px rgba(18,35,31,.08); border: 1px solid rgba(255,255,255,.7);
    }
    .meta { display: grid; gap: .5rem; margin-bottom: 1rem; font-size: .95rem; }
    .meta .label { color: var(--muted); font-size: .8rem; font-weight: 600; }
    .q {
      border-top: 1px solid var(--line); padding: 1rem 0;
    }
    .q:first-of-type { border-top: 0; padding-top: 0; }
    .q-cat { color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .q-text { font-weight: 650; margin: .35rem 0 .5rem; line-height: 1.55; }
    .ans { background: #f0faf7; border-radius: 12px; padding: .75rem .9rem; margin-top: .5rem; }
    .ans h3 { margin: 0 0 .35rem; font-size: .82rem; color: var(--accent-deep); }
    .ans p { margin: 0; line-height: 1.55; font-size: .92rem; white-space: pre-wrap; }
    .pts { margin: .45rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .88rem; }
    .msg { margin-top: 1rem; padding: .9rem 1rem; border-radius: 12px; background: #fdeceb; color: #b42318; }
    .warn { background: #fff7e6; color: #9a6700; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">HR AGENT · 面试官</div>
    <h1>本场面试题单</h1>
    <p class="sub" id="subtitle">加载中…</p>
    <section class="panel hidden" id="panel">
      <div class="meta" id="meta"></div>
      <div id="questions"></div>
    </section>
    <div class="msg hidden" id="err"></div>
  </main>
  <script>
    const token = location.pathname.split("/").filter(Boolean).pop();
    const api = "/v1/public/interviewer/" + encodeURIComponent(token);

    function fmt(dt) {
      if (!dt) return "—";
      try { return new Date(dt).toLocaleString("zh-CN", { hour12: false }); } catch { return dt; }
    }

    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function load() {
      const sub = document.getElementById("subtitle");
      const panel = document.getElementById("panel");
      const errEl = document.getElementById("err");
      try {
        const res = await fetch(api);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || ("HTTP " + res.status));
        }
        sub.textContent = "请在限时内完成面试准备；链接请勿转发。";
        document.getElementById("meta").innerHTML = [
          ["候选人", data.candidate_name],
          ["岗位", data.jd_title],
          ["轮次", "第 " + ((data.round_index || 0) + 1) + " 轮" + (data.round_name ? " · " + data.round_name : "")],
          ["面试时间", data.interview_start ? (fmt(data.interview_start) + " — " + fmt(data.interview_end)) : "见日历邀请"],
          ["地点", data.location || "见日历邀请"],
          ["链接失效", fmt(data.expires_at)],
        ].map(([l,v]) => `<div><span class="label">${esc(l)}</span><div>${esc(v)}</div></div>`).join("");

        const qs = data.questions || [];
        document.getElementById("questions").innerHTML = qs.map((q, i) => {
          const pts = (q.scoring_points || []).map(p => `<li>${esc(p)}</li>`).join("");
          return `<article class="q">
            <div class="q-cat">${esc(q.category || "题目")} · ${esc(q.difficulty || "medium")}</div>
            <div class="q-text">${i+1}. ${esc(q.question)}</div>
            <div class="ans">
              <h3>参考答案</h3>
              <p>${esc(q.reference_answer || "（暂无）")}</p>
              ${pts ? `<ul class="pts">${pts}</ul>` : ""}
            </div>
          </article>`;
        }).join("") || "<p>暂无题目。</p>";

        panel.classList.remove("hidden");
        errEl.classList.add("hidden");
      } catch (e) {
        sub.textContent = "无法加载题单";
        errEl.textContent = e.message || String(e);
        errEl.classList.remove("hidden");
        panel.classList.add("hidden");
      }
    }
    load();
  </script>
</body>
</html>
