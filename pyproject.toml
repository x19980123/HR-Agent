[project]
name = "hr-agent"
version = "0.1.0"
description = "Multi-agent intelligent recruitment system powered by LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=42.0",
  "chromadb>=0.5",
  "httpx>=0.27",
  "tenacity>=8.0",
  "aiosmtplib>=3.0",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hr_agent*"]
